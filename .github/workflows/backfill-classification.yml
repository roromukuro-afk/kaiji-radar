name: Backfill Classification

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "対象件数の上限(空欄なら全件)"
        required: false
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run classification backfill
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            npx tsx scripts/backfill-classification.ts --limit "${{ github.event.inputs.limit }}"
          else
            npx tsx scripts/backfill-classification.ts
          fi
